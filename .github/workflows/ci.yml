name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        concurrency:
          group: validation-${{ github.workflow_ref }}-test-${{ matrix.python-version }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
          cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        strategy:
            matrix:
                # Quote versions so YAML cannot turn 3.10 into 3.1.
                # Python 3.10 is the minimum declared by pyproject.toml.
                python-version: ["3.10", "3.11", "3.12", "3.13"]

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
                  cache-dependency-path: |
                      pyproject.toml
                      requirements-ci.txt

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e . -r requirements-ci.txt

            - name: Run tests with pytest
              run: |
                  python -m pytest -v

            - name: Run type checking with mypy
              run: |
                  python -m mypy src/ --ignore-missing-imports

            - name: Run linting with ruff
              run: |
                  python -m ruff check src/
